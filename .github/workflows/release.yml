name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit SemVer (e.g. 3.7.0). Leave empty to derive from conventional commits."
        required: false
        type: string
        default: ""

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Unit + integration tests
        run: mvn --no-transfer-progress -B verify -DskipITs=false

      - name: Frontend tests
        run: npm run test:frontend

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next version
        id: semver
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.version == ''
        uses: paulhatch/semantic-version@79147b94804704a613626766998afe7b2bd0bb47 # v6.0.5
        with:
          tag_prefix: ""
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: true
          enable_prerelease_mode: false

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
          COMPUTED_VERSION: ${{ steps.semver.outputs.version }}
        run: |
          set -euo pipefail

          VERSION=""
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${MANUAL_VERSION:-}" ]; then
            VERSION="${MANUAL_VERSION}"
          else
            VERSION="${COMPUTED_VERSION}"
          fi

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: ${VERSION}"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists; skipping release."
            echo "released=false" >> "${GITHUB_OUTPUT}"
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          LATEST_TAG="$(git tag -l --sort=-v:refname | head -n1 || true)"
          if [ -n "${LATEST_TAG}" ] && [ "${VERSION}" = "${LATEST_TAG}" ]; then
            echo "Computed version ${VERSION} matches latest tag; nothing to release."
            echo "released=false" >> "${GITHUB_OUTPUT}"
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Releasing version ${VERSION}"
          echo "released=true" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Java
        if: steps.version.outputs.released == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Docker Buildx
        if: steps.version.outputs.released == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build native image
        if: steps.version.outputs.released == 'true'
        run: |
          mvn --no-transfer-progress -B package \
            -Dnative \
            -Dquarkus.native.container-build=true \
            -Drevision="${{ steps.version.outputs.version }}"

      - name: Build Docker image
        if: steps.version.outputs.released == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ghcr.io/felixzmn/docker/feedbox
        run: |
          docker build \
            -f src/main/docker/Dockerfile.native-micro \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            .

      - name: Log in to GHCR
        if: steps.version.outputs.released == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: steps.version.outputs.released == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ghcr.io/felixzmn/docker/feedbox
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

      - name: Create tag and GitHub Release
        if: steps.version.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "release ${VERSION}"
          git push origin "refs/tags/${VERSION}"
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes
