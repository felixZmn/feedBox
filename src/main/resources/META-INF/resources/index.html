    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
  </head>
  <body>
    <ul class="context-menu" id="context-menu">
      <li class="context-menu-item context-add" id="trigger-feed-add">
        Add Feed
      </li>
      <li class="context-menu-item context-add" id="trigger-folder-add">
        Add Folder
      </li>

      <li class="context-menu-item context-feed" id="trigger-open-website">
        Open Website
      </li>
      <li class="context-menu-item context-feed" id="trigger-feed-edit">
        Edit Feed
      </li>
      <li class="context-menu-item context-feed" id="trigger-feed-delete">
        Delete Feed
      </li>

      <li class="context-menu-item context-folder" id="trigger-folder-edit">
        Edit Folder
      </li>
      <li class="context-menu-item context-folder" id="trigger-folder-delete">
        Delete Folder
      </li>
    </ul>

    <div class="layout">
      <aside id="feeds-list" class="feeds-list border-right">
        <div class="column-header">
          <div class="left">
            <a class="item-spacer" id="trigger-profile" title="Profile"
              ><img
                class="icon f-base"
                src="icons/profile_placeholder.svg"
                alt="Profile"
            /></a>
            <a
              class="item-spacer"
              id="trigger-export"
              href="#"
              title="Export feeds"
              ><img
                class="icon f-base"
                src="icons/export.svg"
                alt="Export feeds"
            /></a>
            <a class="item-spacer" id="trigger-import" title="Import feeds"
              ><img
                class="icon f-base"
                src="icons/import.svg"
                alt="Import feeds"
            /></a>
            <a class="item-spacer" id="trigger-refresh" title="Refresh feeds"
              ><img
                id="refresh-spinner"
                class="icon f-base"
                src="icons/refresh.svg"
                alt="Refresh feeds"
            /></a>
          </div>
          <div class="right">
            <a class="item-spacer" id="trigger-logout" title="Logout"
              ><img class="icon f-base" src="icons/logout.svg" alt="Logout"
            /></a>
          </div>
        </div>
        <div class="column" id="feeds-col">
          <div class="details" id="trigger-show-all-feeds">
            <div class="summary">
              <img src="icons/package.svg" class="icon f-base" /><span
                class="tree-name"
                >All Feeds</span
              >
            </div>
          </div>
          <div id="feeds-loading" class="feeds-spinner">
            <img
              class="icon f-base spinner"
              src="icons/refresh.svg"
              alt="Loading"
            />
          </div>
          <div id="folder-container">
            <!-- Folders will be injected here -->
          </div>
          <div class="details space-top" id="trigger-add">
            <div class="summary">
              <img src="icons/feed_add.svg" class="icon f-grey" />
              <span class="tree-name">Add</span>
            </div>
          </div>
          <!-- <div>
            <img class="icon" src="icons/list_search.svg" />
            <span class="folder-name">All Feeds</span>
          </div> -->
          <!-- <details>
            <summary>
              <img class="icon" src="icons/folder.svg" />
              <span class="folder-name">News</span>
            </summary>

            <ul class="files">
              <li>
                <img class="file-img" src="icons/icon.png" alt="file icon" />
                Frankfurter Allgemeine Zeitung
              </li>
              <li>
                <img class="file-img" src="icons/icon.png" alt="file icon" />
                The New York Times
              </li>
              <li>
                <img class="file-img" src="icons/icon.png" alt="folder icon" />
                Tagesschau
              </li>
            </ul>
          </details> -->
        </div>
      </aside>

      <main id="articles-list" class="articles-list border-right">
        <div class="column-header">
          <div class="left">
            <a
              class="item-spacer mobile-back"
              id="trigger-back-feeds"
              href="#"
              title="Back to feeds"
              ><img
                class="icon f-base"
                src="icons/nav_back.svg"
                alt="Back to feeds"
            /></a>
            <div class="search-container">
              <img src="icons/search.svg" alt="" class="icon f-base" />
              <input
                type="text"
                placeholder="Search..."
                id="search-input"
                aria-label="Search articles"
              />
            </div>
          </div>
          <div class="right"></div>
        </div>
        <div class="column">
          <div class="articles-container" id="articles-container"></div>
          <div class="articles-sentinel" id="articles-sentinel"></div>
          <!-- <div class="article" onclick="showView('reader')">
            <div class="header">
              <span class="source">Ars Technica</span>
              <span class="age">2h</span>
            </div>
            <div class="title">
              Rocket Report: Firefly lights the markets up; SpaceX starts
              selling trips to Mars
            </div>
          </div> -->
        </div>
      </main>

      <section id="reader" class="reader">
        <div class="column-header">
          <div class="left">
            <a
              class="item-spacer reader-back"
              id="trigger-close"
              href="#"
              title="Back to articles"
              ><img
                class="icon f-base"
                src="icons/nav_back.svg"
                alt="Back to articles"
            /></a>
          </div>
          <div class="right">
            <a
              class="item-spacer d-none"
              id="trigger-external-open"
              href="#"
              target="_blank"
              title="Open in browser"
              ><img
                class="icon f-base"
                src="icons/external.svg"
                alt="Open in browser"
            /></a>
            <a
              class="item-spacer"
              id="trigger-previous"
              title="Previous article"
              ><img
                class="icon f-base"
                src="icons/reader_previous.svg"
                alt="Previous article"
            /></a>
            <a class="item-spacer" id="trigger-next" title="Next article"
              ><img
                class="icon f-base"
                src="icons/reader_next.svg"
                alt="Next article"
            /></a>
          </div>
        </div>
        <div class="column">
          <div class="article">
            <h1 class="title">No article selected</h1>
            <div id="reader-publisher"></div>
            <div class="date"></div>
            <div class="border-bottom"></div>
            <div class="content"></div>
          </div>
        </div>
      </section>
    </div>

    <dialog id="generic-modal" class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Title</h2>
        <button class="icon-btn close-modal">&times;</button>
      </div>

      <div id="modal-body" class="modal-body"></div>

      <div class="modal-footer">
        <button id="btn-cancel" class="btn btn-secondary">Cancel</button>
        <button id="btn-confirm" class="btn btn-primary">Confirm</button>
      </div>
    </dialog>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
