<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>feedBox</title>
    <link rel="stylesheet" href="./style.css" />
    <meta name="theme-color" content="#005e83" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <link

    />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <ul class="context-menu" id="context-menu" role="menu">
      <li
        class="context-menu-item context-add"
        id="trigger-feed-add"
        role="menuitem"
        tabindex="0"
      >
        Add Feed
      </li>
      <li
        class="context-menu-item context-add"
        id="trigger-folder-add"
        role="menuitem"
        tabindex="0"
      >
        Add Folder
      </li>

      <li
        class="context-menu-item context-feed"
        id="trigger-open-website"
        role="menuitem"
        tabindex="0"
      >
        Open Website
      </li>
      <li
        class="context-menu-item context-feed"
        id="trigger-feed-edit"
        role="menuitem"
        tabindex="0"
      >
        Edit Feed
      </li>
      <li
        class="context-menu-item context-feed"
        id="trigger-feed-delete"
        role="menuitem"
        tabindex="0"
      >
        Delete Feed
      </li>

      <li
        class="context-menu-item context-folder"
        id="trigger-folder-edit"
        role="menuitem"
        tabindex="0"
      >
        Edit Folder
      </li>
      <li
        class="context-menu-item context-folder"
        id="trigger-folder-delete"
        role="menuitem"
        tabindex="0"
      >
        Delete Folder
      </li>
    </ul>

    <div class="layout">
      <aside id="feeds-list" class="feeds-list border-right">
        <div class="column-header">
          <div class="left">
            <button
              type="button"
              class="item-spacer"
              id="trigger-profile"
              title="Profile"
              aria-label="Profile"
            >
              <img
                class="icon f-base"
                src="icons/profile_placeholder.svg"
                alt=""
              />
            </button>
            <button
              type="button"
              class="item-spacer"
              id="trigger-export"
              title="Export feeds"
              aria-label="Export feeds"
            >
              <img class="icon f-base" src="icons/export.svg" alt="" />
            </button>
            <button
              type="button"
              class="item-spacer"
              id="trigger-import"
              title="Import feeds"
              aria-label="Import feeds"
            >
              <img class="icon f-base" src="icons/import.svg" alt="" />
            </button>
            <button
              type="button"
              class="item-spacer"
              id="trigger-refresh"
              title="Refresh feeds"
              aria-label="Refresh feeds"
            >
              <img
                id="refresh-spinner"
                class="icon f-base"
                src="icons/refresh.svg"
                alt=""
              />
            </button>
          </div>
          <div class="right">
            <button
              type="button"
              class="item-spacer"
              id="trigger-logout"
              title="Logout"
              aria-label="Logout"
            >
              <img class="icon f-base" src="icons/logout.svg" alt="" />
            </button>
          </div>
        </div>
        <div class="column" id="feeds-col">
          <div class="details" id="trigger-show-all-feeds">
            <div class="summary">
              <img src="icons/package.svg" class="icon f-base" alt="" /><span
                class="tree-name"
                >All Feeds</span
              >
            </div>
          </div>
          <div id="feeds-loading" class="feeds-spinner">
            <img
              class="icon f-base spinner"
              src="icons/refresh.svg"
              alt="Loading"
            />
          </div>
          <div id="folder-container">
            <!-- Folders will be injected here -->
          </div>
          <script>
            // Paint cached folders synchronously before deferred modules load.
            // On slow mobile this avoids an empty sidebar while main.js downloads.
            (function () {
              try {
                var raw = localStorage.getItem("folder-tree-cache");
                if (!raw) return;
                var data = JSON.parse(raw);
                if (
                  !data ||
                  !Array.isArray(data.folders) ||
                  !Array.isArray(data.unfiledFeeds)
                ) {
                  return;
                }

                var loading = document.getElementById("feeds-loading");
                if (loading) loading.classList.add("d-none");

                var openStates = {};
                try {
                  openStates =
                    JSON.parse(localStorage.getItem("folder-state") || "{}") ||
                    {};
                } catch (e) {}

                var container = document.getElementById("folder-container");
                if (!container) return;

                function appendFeed(ul, feed) {
                  var li = document.createElement("li");
                  li.dataset.feedId = String(feed.id);
                  var icon = document.createElement("img");
                  icon.src = "./api/icon/" + feed.id;
                  icon.className = "tree-entry-icon";
                  icon.alt = "";
                  var name = document.createElement("span");
                  name.className = "tree-name";
                  name.textContent = feed.name || "";
                  var options = document.createElement("span");
                  options.className = "tree-options";
                  options.textContent = "\u22EE";
                  li.appendChild(icon);
                  li.appendChild(name);
                  if (feed.lastError) {
                    var err = document.createElement("span");
                    err.className = "feed-error";
                    err.textContent = "!";
                    err.title = feed.lastError;
                    li.appendChild(err);
                  }
                  li.appendChild(options);
                  ul.appendChild(li);
                }

                data.folders.forEach(function (folder) {
                  var details = document.createElement("details");
                  details.dataset.folderId = String(folder.id);
                  if (
                    Object.prototype.hasOwnProperty.call(openStates, folder.id)
                  ) {
                    details.open = !!openStates[folder.id];
                  }

                  var summary = document.createElement("summary");
                  var img = document.createElement("img");
                  img.src = "icons/folder.svg";
                  img.alt = "";
                  img.className = "icon " + (folder.color || "");
                  var nameSpan = document.createElement("span");
                  nameSpan.className = "tree-name";
                  nameSpan.textContent = folder.name || "";
                  var folderOptions = document.createElement("span");
                  folderOptions.className = "tree-options";
                  folderOptions.textContent = "\u22EE";
                  summary.appendChild(img);
                  summary.appendChild(nameSpan);
                  summary.appendChild(folderOptions);
                  details.appendChild(summary);

                  var feedsContainer = document.createElement("div");
                  feedsContainer.className = "folder-container";
                  var ul = document.createElement("ul");
                  ul.className = "feeds-ul";
                  (folder.feeds || []).forEach(function (feed) {
                    appendFeed(ul, feed);
                  });
                  feedsContainer.appendChild(ul);
                  details.appendChild(feedsContainer);
                  container.appendChild(details);
                });

                if (data.unfiledFeeds.length) {
                  var unfiledUl = document.createElement("ul");
                  unfiledUl.className = "feeds-ul";
                  data.unfiledFeeds.forEach(function (feed) {
                    appendFeed(unfiledUl, feed);
                  });
                  container.appendChild(unfiledUl);
                }

                container.dataset.bootPainted = "1";
              } catch (e) {}
            })();
          </script>
          <div class="details space-top" id="trigger-add">
            <div class="summary">
              <img src="icons/feed_add.svg" class="icon f-grey" alt="" />
              <span class="tree-name">Add</span>
            </div>
          </div>
        </div>
      </aside>

      <main id="articles-list" class="articles-list border-right">
        <div class="column-header">
          <div class="left">
            <button
              type="button"
              class="item-spacer mobile-back"
              id="trigger-back-feeds"
              title="Back to feeds"
              aria-label="Back to feeds"
            >
              <img class="icon f-base" src="icons/nav_back.svg" alt="" />
            </button>
            <div class="search-container">
              <img src="icons/search.svg" alt="" class="icon f-base" />
              <input
                type="text"
                placeholder="Search loaded articles..."
                id="search-input"
                aria-label="Search loaded articles"
                title="Search filters articles already loaded in the list"
              />
            </div>
          </div>
          <div class="right"></div>
        </div>
        <div class="column">
          <div class="articles-container" id="articles-container"></div>
          <div class="articles-sentinel" id="articles-sentinel"></div>
        </div>
      </main>

      <section id="reader" class="reader">
        <div class="column-header">
          <div class="left">
            <button
              type="button"
              class="item-spacer reader-back"
              id="trigger-close"
              title="Back to articles"
              aria-label="Back to articles"
            >
              <img class="icon f-base" src="icons/nav_back.svg" alt="" />
            </button>
          </div>
          <div class="right">
            <a
              class="item-spacer d-none"
              id="trigger-external-open"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              title="Open in browser"
              aria-label="Open in browser"
              ><img
                class="icon f-base"
                src="icons/external.svg"
                alt=""
            /></a>
            <button
              type="button"
              class="item-spacer"
              id="trigger-previous"
              title="Previous article"
              aria-label="Previous article"
            >
              <img class="icon f-base" src="icons/reader_previous.svg" alt="" />
            </button>
            <button
              type="button"
              class="item-spacer"
              id="trigger-next"
              title="Next article"
              aria-label="Next article"
            >
              <img class="icon f-base" src="icons/reader_next.svg" alt="" />
            </button>
          </div>
        </div>
        <div class="column">
          <div class="article">
            <h1 class="title">No article selected</h1>
            <div id="reader-publisher"></div>
            <div class="date"></div>
            <div class="border-bottom"></div>
            <div class="content"></div>
          </div>
        </div>
      </section>
    </div>

    <dialog id="generic-modal" class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Title</h2>
        <button class="icon-btn close-modal">&times;</button>
      </div>

      <div id="modal-body" class="modal-body"></div>

      <div class="modal-footer">
        <button id="btn-cancel" class="btn btn-secondary">Cancel</button>
        <button id="btn-confirm" class="btn btn-primary">Confirm</button>
      </div>
    </dialog>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
