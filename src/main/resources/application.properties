# Committed defaults only — no secrets or environment-specific URLs here.
# Local dev: copy application-local.properties.example → application-local.properties (gitignored).
# Docker/K8s/Helm: set env vars (see README).

%dev.quarkus.config.locations=application-local.properties

# OIDC authorization-code (web-app) session — httpOnly cookies (SPA never sees tokens).
# Authentik JWTs are large: keep only id+refresh, split cookies, compact encryption,
# and raise header limits so browsers/Quarkus do not return HTTP 431.
quarkus.oidc.enabled=true
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.scopes=openid,profile
# Fixed callback path (must match an IdP Redirect URI exactly, e.g. http://localhost:8080/oidc).
# Using / alone often becomes http://localhost:8080/ (trailing slash) and mismatches SPA-era URIs.
quarkus.oidc.authentication.redirect-path=/oidc
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.cookie-path=/
# Avoid piling up q_auth state cookies across concurrent challenges.
quarkus.oidc.authentication.allow-multiple-code-flows=false
# XHR/fetch get 499 instead of a 302 to the IdP so the SPA can reload.
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
quarkus.oidc.token-state-manager.split-tokens=true
quarkus.oidc.token-state-manager.strategy=id-refresh-tokens
quarkus.oidc.token-state-manager.encryption-algorithm=dir
quarkus.http.limits.max-header-size=64K

# Deny by default: every JAX-RS method must opt in with @Authenticated or @PermitAll.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Path policies: health (and Quarkus non-app /q/*) stay public; everything else needs a session.
quarkus.http.auth.permission.public.paths=/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=16

# Flyway: manage the schema from versioned migrations in src/main/resources/db/migration.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=classpath:db/migration

# HTTP Service Configuration (single OutboundHttpClient for feeds/icons)
app.http.user-agent=FeedBox/${quarkus.application.version}
app.http.timeout=30
app.http.max-redirects=5
# 10 MiB feeds, 2 MiB favicons
app.http.max-bytes.feed=10485760
app.http.max-bytes.icon=2097152

# Clickjacking protection (frame-ancestors is ignored in <meta> CSP; must be an HTTP header)
quarkus.http.header."Content-Security-Policy".value=frame-ancestors 'none'

# scheduler config
refresh.job.interval=1h
# max number of feeds refreshed in parallel (virtual threads + bounded concurrency)
refresh.concurrency=10
# max parallel feed creates during OPML import
import.concurrency=5

quarkus.native.additional-build-args=--initialize-at-run-time=com.apptasticsoftware.rssreader.AbstractRssReader
