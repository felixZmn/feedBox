quarkus.oidc.enabled=false

quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.publickey.location=https://authentik.0x2b.de/application/o/yarr/jwks/
mp.jwt.verify.issuer=NONE

sso.clientid=3KIxUxUJ42z94xMdn4ku29XjBh7roLPrExbCoPtM
sso.redirectUri=http://localhost:8080
sso.authServerUrl=https://authentik.0x2b.de/application/o/
sso.endSessionEndpoint=https://authentik.0x2b.de/application/o/yarr/end-session/

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres?password=password&user=user
quarkus.datasource.jdbc.max-size=16

# Flyway: manage the schema from versioned migrations in src/main/resources/db/migration.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=classpath:db/migration

# HTTP Service Configuration
app.http.user-agent=FeedBox/${quarkus.application.version}
app.http.timeout=30
# scheduler config
refresh.job.interval=1h
# max number of feeds refreshed in parallel (virtual threads + bounded concurrency)
refresh.concurrency=10
quarkus.native.additional-build-args=--initialize-at-run-time=com.apptasticsoftware.rssreader.AbstractRssReader

# OpenTelemetry: compile tracing into the native image, but keep SDK off by default.
# Enable at runtime via QUARKUS_OTEL_SDK_DISABLED=false (Helm tracing.enabled=true).
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false
quarkus.otel.sdk.disabled=true
quarkus.otel.propagators=tracecontext,baggage
