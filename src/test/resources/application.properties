# Test profile for @QuarkusTest / *IT (Dev Services Postgres + Flyway).
# Pure Mockito unit tests do not start Quarkus and ignore these settings.

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.scheduler.enabled=false

# Minimal JWT config so SmallRye JWT starts; @TestSecurity supplies the identity.
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.issuer=https://feedbox.test/
%test.mp.jwt.verify.audiences=feedbox-test

%test.sso.clientid=feedbox-test
%test.sso.redirectUri=http://localhost:8081/
%test.sso.authServerUrl=https://feedbox.test/
%test.sso.endSessionEndpoint=https://feedbox.test/end-session/
