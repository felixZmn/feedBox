# Integration tests use Dev Services Postgres + Flyway.
# OIDC is disabled; @TestSecurity supplies the identity for @Authenticated endpoints.

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.scheduler.enabled=false

%test.quarkus.oidc.enabled=false
# Do not force browser redirects in tests — JAX-RS @Authenticated + @TestSecurity is enough.
%test.quarkus.http.auth.permission.authenticated.policy=permit
